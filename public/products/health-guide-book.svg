<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg_book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5F8" />
      <stop offset="1" stop-color="#FFEBF2" />
    </linearGradient>
    <linearGradient id="box_book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFE4EB" />
    </linearGradient>
    <filter id="sh_book" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A0D1B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg_book)" />
  <circle cx="480" cy="130" r="130" fill="#FFD9E2" opacity="0.4" />
  <circle cx="110" cy="480" r="110" fill="#FFF1F4" opacity="0.6" />

  <!-- Packaging Box -->
  <g transform="translate(140, 90)" filter="url(#sh_book)">
    <rect width="320" height="420" rx="28" fill="url(#box_book)" stroke="#E896AA" stroke-width="2" />
    
    <!-- Top Accent Band -->
    <path d="M0 28 C0 12 12 0 28 0 L292 0 C308 0 320 12 320 28 L320 80 L0 80 Z" fill="#C8202F" />
    <text x="160" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SAMAURA</text>

    <!-- Open Book Motif -->
    <g transform="translate(160, 205)">
      <!-- Book spine & pages -->
      <path d="M 0 -35 C 18 -45 50 -45 65 -38 L 65 35 C 50 28 18 28 0 38 C -18 28 -50 28 -65 35 L -65 -38 C -50 -45 -18 -45 0 -35 Z" fill="#FFFFFF" stroke="#F5A3B7" stroke-width="2" />
      <path d="M 0 -35 L 0 38" stroke="#E896AA" stroke-width="2" />
      <!-- Page lines -->
      <line x1="-50" y1="-15" x2="-15" y2="-15" stroke="#FFE4EB" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-50" y1="2" x2="-15" y2="2" stroke="#FFE4EB" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-50" y1="18" x2="-25" y2="18" stroke="#FFE4EB" stroke-width="2.5" stroke-linecap="round" />
      <line x1="15" y1="-15" x2="50" y2="-15" stroke="#FFE4EB" stroke-width="2.5" stroke-linecap="round" />
      <line x1="15" y1="2" x2="50" y2="2" stroke="#FFE4EB" stroke-width="2.5" stroke-linecap="round" />
      <line x1="15" y1="18" x2="40" y2="18" stroke="#FFE4EB" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Product Wordmark Bottom -->
    <text x="160" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2C1820" text-anchor="middle" letter-spacing="1">MENSTRUAL HEALTH GUIDE</text>
    <text x="160" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#C8202F" text-anchor="middle" letter-spacing="2">EDUCATIONAL PUBLICATION</text>
    <circle cx="160" cy="388" r="3.5" fill="#C8202F" />
  </g>
</svg>
