<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg_duo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5F8" />
      <stop offset="1" stop-color="#FFEBF2" />
    </linearGradient>
    <linearGradient id="box_duo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFE4EB" />
    </linearGradient>
    <filter id="sh_duo" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A0D1B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg_duo)" />
  <circle cx="480" cy="130" r="130" fill="#FFD9E2" opacity="0.4" />
  <circle cx="110" cy="480" r="110" fill="#FFF1F4" opacity="0.6" />

  <!-- Packaging Box -->
  <g transform="translate(140, 90)" filter="url(#sh_duo)">
    <rect width="320" height="420" rx="28" fill="url(#box_duo)" stroke="#E896AA" stroke-width="2" />
    
    <!-- Top Accent Band -->
    <path d="M0 28 C0 12 12 0 28 0 L292 0 C308 0 320 12 320 28 L320 80 L0 80 Z" fill="#C8202F" />
    <text x="160" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SAMAURA</text>

    <!-- Twin Cup Motif -->
    <g transform="translate(125, 205)">
      <!-- Left Cup -->
      <path d="M -36 -50 C -36 5 -10 48 0 58 C 10 48 36 5 36 -50 Z" fill="#FFEBF0" stroke="#F5A3B7" stroke-width="2" />
      <ellipse cx="0" cy="-50" rx="36" ry="10" fill="#FFFFFF" stroke="#F5A3B7" stroke-width="2" />
      <path d="M -2 58 L -2 82 C -2 85 2 85 2 82 L 2 58 Z" fill="#F5A3B7" />
    </g>
    <g transform="translate(195, 205)">
      <!-- Right Cup -->
      <path d="M -36 -50 C -36 5 -10 48 0 58 C 10 48 36 5 36 -50 Z" fill="#FFF0F5" stroke="#E896AA" stroke-width="2" />
      <ellipse cx="0" cy="-50" rx="36" ry="10" fill="#FFFFFF" stroke="#E896AA" stroke-width="2" />
      <path d="M -2 58 L -2 82 C -2 85 2 85 2 82 L 2 58 Z" fill="#E896AA" />
    </g>

    <!-- Product Wordmark Bottom -->
    <text x="160" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2C1820" text-anchor="middle" letter-spacing="1">MENSTRUAL CUP</text>
    <text x="160" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#C8202F" text-anchor="middle" letter-spacing="2">PACK OF 2</text>
    <circle cx="160" cy="388" r="3.5" fill="#C8202F" />
  </g>
</svg>
