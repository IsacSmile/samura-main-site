<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg_fpg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5F8" />
      <stop offset="1" stop-color="#FFEBF2" />
    </linearGradient>
    <linearGradient id="box_fpg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFE4EB" />
    </linearGradient>
    <filter id="sh_fpg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A0D1B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg_fpg)" />
  <circle cx="480" cy="130" r="130" fill="#FFD9E2" opacity="0.4" />
  <circle cx="110" cy="480" r="110" fill="#FFF1F4" opacity="0.6" />

  <!-- Packaging Box -->
  <g transform="translate(140, 90)" filter="url(#sh_fpg)">
    <rect width="320" height="420" rx="28" fill="url(#box_fpg)" stroke="#E896AA" stroke-width="2" />
    
    <!-- Top Accent Band -->
    <path d="M0 28 C0 12 12 0 28 0 L292 0 C308 0 320 12 320 28 L320 80 L0 80 Z" fill="#C8202F" />
    <text x="160" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SAMAURA</text>

    <!-- Gift Box with Ribbon Motif -->
    <g transform="translate(160, 205)">
      <!-- Box base -->
      <rect x="-48" y="-30" width="96" height="75" rx="6" fill="#FFEBF0" stroke="#F5A3B7" stroke-width="2" />
      <!-- Box lid -->
      <rect x="-54" y="-45" width="108" height="18" rx="4" fill="#FFFFFF" stroke="#F5A3B7" stroke-width="2" />
      <!-- Vertical ribbon -->
      <rect x="-7" y="-45" width="14" height="90" fill="#C8202F" />
      <!-- Ribbon Bow -->
      <path d="M 0 -45 C -20 -65 -35 -45 0 -45 C 35 -45 20 -65 0 -45 Z" fill="#C8202F" />
      <circle cx="0" cy="-45" r="4.5" fill="#FFFFFF" />
    </g>

    <!-- Product Wordmark Bottom -->
    <text x="160" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2C1820" text-anchor="middle" letter-spacing="1">MY FIRST PERIOD</text>
    <text x="160" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#C8202F" text-anchor="middle" letter-spacing="2">GIFT BOX</text>
    <circle cx="160" cy="388" r="3.5" fill="#C8202F" />
  </g>
</svg>
