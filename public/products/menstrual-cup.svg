<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg_cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5F8" />
      <stop offset="1" stop-color="#FFEBF2" />
    </linearGradient>
    <linearGradient id="box_cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFE4EB" />
    </linearGradient>
    <filter id="sh_cup" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A0D1B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg_cup)" />
  <circle cx="480" cy="130" r="130" fill="#FFD9E2" opacity="0.4" />
  <circle cx="110" cy="480" r="110" fill="#FFF1F4" opacity="0.6" />

  <!-- Packaging Box -->
  <g transform="translate(140, 90)" filter="url(#sh_cup)">
    <rect width="320" height="420" rx="28" fill="url(#box_cup)" stroke="#E896AA" stroke-width="2" />
    
    <!-- Top Accent Band -->
    <path d="M0 28 C0 12 12 0 28 0 L292 0 C308 0 320 12 320 28 L320 80 L0 80 Z" fill="#C8202F" />
    <text x="160" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SAMAURA</text>

    <!-- Packaging Motif: Menstrual Cup Bell / Tulip Contour -->
    <g transform="translate(160, 205)">
      <!-- Cup Body -->
      <path d="M -48 -60 C -48 10 -15 65 0 75 C 15 65 48 10 48 -60 Z" fill="#FFEBF0" stroke="#F5A3B7" stroke-width="2" />
      <!-- Top Rim -->
      <ellipse cx="0" cy="-60" rx="48" ry="12" fill="#FFFFFF" stroke="#F5A3B7" stroke-width="2" />
      <!-- Stem -->
      <path d="M -3 75 L -3 105 C -3 108 3 108 3 105 L 3 75 Z" fill="#F5A3B7" />
    </g>

    <!-- Product Wordmark Bottom -->
    <text x="160" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2C1820" text-anchor="middle" letter-spacing="1">MENSTRUAL CUP</text>
    <circle cx="160" cy="380" r="4" fill="#C8202F" />
  </g>
</svg>
