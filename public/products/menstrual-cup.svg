<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FFF9FB" />
      <stop offset="100%" stop-color="#FFE4EE" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A3B7" />
      <stop offset="50%" stop-color="#FFBDCE" />
      <stop offset="100%" stop-color="#F5A3B7" />
    </linearGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF7FA" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8202F" />
      <stop offset="100%" stop-color="#E84855" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#F5A3B7" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />
  <circle cx="680" cy="140" r="180" fill="#FFD9E2" opacity="0.4" filter="blur(40px)" />
  <circle cx="120" cy="680" r="160" fill="#FFE0EB" opacity="0.3" filter="blur(40px)" />

  <g transform="translate(180, 140)" filter="url(#shadow)">
    <rect width="440" height="520" rx="36" fill="url(#packGrad)" stroke="#FFD9E2" stroke-width="2" />
    
    <path d="M0 36 C0 16 16 0 36 0 L404 0 C424 0 440 16 440 36 L440 120 L0 120 Z" fill="url(#brandGrad)" />
    
    <text x="220" y="65" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SAMAURA</text>
    <text x="220" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFE4EB" text-anchor="middle" letter-spacing="2">SUSTAINABLE WELLNESS</text>

    <!-- Menstrual Cup Shape -->
    <g transform="translate(220, 260)">
      <!-- Rim -->
      <ellipse cx="0" cy="-60" rx="65" ry="16" fill="url(#cupGrad)" stroke="#E87C96" stroke-width="2" />
      <!-- Body -->
      <path d="M -65 -60 C -60 20 -20 60 0 70 C 20 60 60 20 65 -60 Z" fill="url(#cupGrad)" stroke="#E87C96" stroke-width="2" opacity="0.9" />
      <!-- Stem -->
      <rect x="-4" y="70" width="8" height="35" rx="4" fill="#E87C96" />
      <line x1="-3" y1="80" x2="3" y2="80" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="-3" y1="90" x2="3" y2="90" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="-3" y1="100" x2="3" y2="100" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <!-- Air Holes & Rings -->
      <ellipse cx="0" cy="-30" rx="50" ry="10" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.7" />
    </g>

    <text x="220" y="415" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#3B1F2B" text-anchor="middle">Medical Silicone Menstrual Cup</text>
    <text x="220" y="440" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#6B5B62" text-anchor="middle">100% US-FDA Approved Liquid Silicone</text>

    <g transform="translate(220, 480)">
      <rect x="-160" y="-14" width="95" height="28" rx="14" fill="#E8F8F3" stroke="#A7E4D3" stroke-width="1" />
      <text x="-112" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#2D7A61" text-anchor="middle">10-YR REUSABLE</text>

      <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#FFF1F4" stroke="#FFD9E2" stroke-width="1" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#C8202F" text-anchor="middle">12H LEAKPROOF</text>

      <rect x="65" y="-14" width="95" height="28" rx="14" fill="#F4F4F6" stroke="#E2E2E6" stroke-width="1" />
      <text x="112" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#4B4B52" text-anchor="middle">POUCH INCL.</text>
    </g>
  </g>
</svg>
