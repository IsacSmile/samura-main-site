<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg_hmp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5F8" />
      <stop offset="1" stop-color="#FFEBF2" />
    </linearGradient>
    <linearGradient id="box_hmp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFE4EB" />
    </linearGradient>
    <filter id="sh_hmp" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A0D1B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg_hmp)" />
  <circle cx="480" cy="130" r="130" fill="#FFD9E2" opacity="0.4" />
  <circle cx="110" cy="480" r="110" fill="#FFF1F4" opacity="0.6" />

  <!-- Packaging Box -->
  <g transform="translate(140, 90)" filter="url(#sh_hmp)">
    <rect width="320" height="420" rx="28" fill="url(#box_hmp)" stroke="#E896AA" stroke-width="2" />
    
    <!-- Top Accent Band -->
    <path d="M0 28 C0 12 12 0 28 0 L292 0 C308 0 320 12 320 28 L320 80 L0 80 Z" fill="#C8202F" />
    <text x="160" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SAMAURA</text>

    <!-- Celebration Hamper Basket Motif -->
    <g transform="translate(160, 205)">
      <!-- Basket base -->
      <path d="M -50 -10 L -40 45 C -40 50 40 50 40 45 L 50 -10 Z" fill="#FFEBF0" stroke="#F5A3B7" stroke-width="2" />
      <!-- Weave lines -->
      <line x1="-42" y1="15" x2="42" y2="15" stroke="#E896AA" stroke-width="1.5" />
      <line x1="-30" y1="-10" x2="-20" y2="45" stroke="#E896AA" stroke-width="1.5" />
      <line x1="0" y1="-10" x2="0" y2="48" stroke="#E896AA" stroke-width="1.5" />
      <line x1="30" y1="-10" x2="20" y2="45" stroke="#E896AA" stroke-width="1.5" />
      <!-- Hamper goodies popping out -->
      <circle cx="-25" cy="-25" r="14" fill="#FFFFFF" stroke="#F5A3B7" stroke-width="1.5" />
      <rect x="-10" y="-38" width="22" height="30" rx="3" fill="#FFF0F5" stroke="#E896AA" stroke-width="1.5" />
      <circle cx="25" cy="-22" r="12" fill="#FFFFFF" stroke="#F5A3B7" stroke-width="1.5" />
      <!-- Arch handle -->
      <path d="M -48 -10 C -48 -60 48 -60 48 -10" stroke="#C8202F" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>

    <!-- Product Wordmark Bottom -->
    <text x="160" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2C1820" text-anchor="middle" letter-spacing="1">SELF-CARE CELEBRATION</text>
    <text x="160" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#C8202F" text-anchor="middle" letter-spacing="2">HAMPER</text>
    <circle cx="160" cy="388" r="3.5" fill="#C8202F" />
  </g>
</svg>
