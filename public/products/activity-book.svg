<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg_act" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5F8" />
      <stop offset="1" stop-color="#FFEBF2" />
    </linearGradient>
    <linearGradient id="box_act" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFE4EB" />
    </linearGradient>
    <filter id="sh_act" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A0D1B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg_act)" />
  <circle cx="480" cy="130" r="130" fill="#FFD9E2" opacity="0.4" />
  <circle cx="110" cy="480" r="110" fill="#FFF1F4" opacity="0.6" />

  <!-- Packaging Box -->
  <g transform="translate(140, 90)" filter="url(#sh_act)">
    <rect width="320" height="420" rx="28" fill="url(#box_act)" stroke="#E896AA" stroke-width="2" />
    
    <!-- Top Accent Band -->
    <path d="M0 28 C0 12 12 0 28 0 L292 0 C308 0 320 12 320 28 L320 80 L0 80 Z" fill="#C8202F" />
    <text x="160" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SAMAURA</text>

    <!-- Activity Book Motif (Book + Pencil/Star) -->
    <g transform="translate(160, 205)">
      <!-- Book cover outline -->
      <rect x="-45" y="-55" width="90" height="110" rx="6" fill="#FFFFFF" stroke="#F5A3B7" stroke-width="2" />
      <!-- Book spine band -->
      <path d="M -45 -55 L -35 -55 L -35 55 L -45 55 Z" fill="#FFEBF0" />
      <line x1="-35" y1="-55" x2="-35" y2="55" stroke="#E896AA" stroke-width="1.5" />
      <!-- Center Activity Star / Sparkle icon -->
      <circle cx="2" cy="-2" r="18" fill="#FFF5F8" stroke="#F5A3B7" stroke-width="1.5" />
      <path d="M 2 -14 L 5 -5 L 14 -2 L 5 1 L 2 10 L -1 1 L -10 -2 L -1 -5 Z" fill="#C8202F" />
      <!-- Exercise lines -->
      <line x1="-20" y1="28" x2="25" y2="28" stroke="#FFE4EB" stroke-width="2" stroke-linecap="round" />
      <line x1="-20" y1="38" x2="15" y2="38" stroke="#FFE4EB" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Product Wordmark Bottom -->
    <text x="160" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2C1820" text-anchor="middle" letter-spacing="1">ACTIVITY BOOK</text>
    <text x="160" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#C8202F" text-anchor="middle" letter-spacing="2">FOR YOUNG READERS</text>
    <circle cx="160" cy="388" r="3.5" fill="#C8202F" />
  </g>
</svg>
