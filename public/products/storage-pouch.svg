<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg_pouch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5F8" />
      <stop offset="1" stop-color="#FFEBF2" />
    </linearGradient>
    <linearGradient id="box_pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFE4EB" />
    </linearGradient>
    <filter id="sh_pouch" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A0D1B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg_pouch)" />
  <circle cx="480" cy="130" r="130" fill="#FFD9E2" opacity="0.4" />
  <circle cx="110" cy="480" r="110" fill="#FFF1F4" opacity="0.6" />

  <!-- Packaging Box -->
  <g transform="translate(140, 90)" filter="url(#sh_pouch)">
    <rect width="320" height="420" rx="28" fill="url(#box_pouch)" stroke="#E896AA" stroke-width="2" />
    
    <!-- Top Accent Band -->
    <path d="M0 28 C0 12 12 0 28 0 L292 0 C308 0 320 12 320 28 L320 80 L0 80 Z" fill="#C8202F" />
    <text x="160" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SAMAURA</text>

    <!-- Drawstring Pouch Motif -->
    <g transform="translate(160, 205)">
      <!-- Pouch Body -->
      <path d="M -45 -30 C -45 50 -35 70 0 75 C 35 70 45 50 45 -30 C 35 -35 20 -30 0 -30 C -20 -30 -35 -35 -45 -30 Z" fill="#FFEBF0" stroke="#F5A3B7" stroke-width="2" />
      <!-- Drawstring Top Ruffle -->
      <path d="M -40 -45 C -30 -50 0 -45 0 -45 C 0 -45 30 -50 40 -45 C 35 -35 25 -32 0 -32 C -25 -32 -35 -35 -40 -45 Z" fill="#FFFFFF" stroke="#F5A3B7" stroke-width="2" />
      <!-- Drawstring Ribbon Cord -->
      <path d="M -30 -35 Q -40 -15 -48 0 M 30 -35 Q 40 -15 48 0" stroke="#C8202F" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <circle cx="-48" cy="2" r="3" fill="#C8202F" />
      <circle cx="48" cy="2" r="3" fill="#C8202F" />
    </g>

    <!-- Product Wordmark Bottom -->
    <text x="160" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2C1820" text-anchor="middle" letter-spacing="1">CUP STORAGE POUCH</text>
    <text x="160" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#C8202F" text-anchor="middle" letter-spacing="2">TRAVEL ACCESSORY</text>
    <circle cx="160" cy="388" r="3.5" fill="#C8202F" />
  </g>
</svg>
