<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8FC" />
      <stop offset="50%" stop-color="#FBFDFF" />
      <stop offset="100%" stop-color="#E5F0FA" />
    </linearGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D72D9" />
      <stop offset="100%" stop-color="#4F8CEB" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#2D72D9" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />
  <circle cx="680" cy="140" r="180" fill="#D6E7FA" opacity="0.4" filter="blur(40px)" />
  <circle cx="120" cy="680" r="160" fill="#FFD9E2" opacity="0.3" filter="blur(40px)" />

  <g transform="translate(180, 140)" filter="url(#shadow)">
    <rect width="440" height="520" rx="36" fill="url(#packGrad)" stroke="#D0E3F7" stroke-width="2" />
    
    <path d="M0 36 C0 16 16 0 36 0 L404 0 C424 0 440 16 440 36 L440 120 L0 120 Z" fill="url(#blueGrad)" />
    
    <text x="220" y="65" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SAMAURA</text>
    <text x="220" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#DCE9F9" text-anchor="middle" letter-spacing="2">HYGIENE APPLIANCES</text>

    <!-- Sterilizer Illustration -->
    <g transform="translate(220, 260)">
      <!-- Base Unit -->
      <rect x="-65" y="0" width="130" height="70" rx="18" fill="#F0F5FA" stroke="#BDD6F2" stroke-width="2" />
      <!-- Power Button -->
      <circle cx="0" cy="35" r="14" fill="#FFFFFF" stroke="#2D72D9" stroke-width="2" />
      <path d="M 0 27 L 0 34" stroke="#2D72D9" stroke-width="2" stroke-linecap="round" />
      <path d="M -5 30 A 7 7 0 1 0 5 30" stroke="#2D72D9" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Dome Top Lid -->
      <path d="M -60 0 C -60 -70 60 -70 60 0 Z" fill="#E1EEFC" stroke="#BDD6F2" stroke-width="2" opacity="0.85" />
      <!-- Steam Lines -->
      <path d="M -15 -85 C -25 -100 -5 -115 -15 -130" stroke="#4F8CEB" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
      <path d="M 15 -85 C 5 -100 25 -115 15 -130" stroke="#4F8CEB" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

    <text x="220" y="415" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#3B1F2B" text-anchor="middle">Cup Steam Sterilizer</text>
    <text x="220" y="440" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#6B5B62" text-anchor="middle">3-Min Rapid Steam Disinfection • 99.9% Clean</text>

    <g transform="translate(220, 480)">
      <rect x="-160" y="-14" width="95" height="28" rx="14" fill="#E8F8F3" stroke="#A7E4D3" stroke-width="1" />
      <text x="-112" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#2D7A61" text-anchor="middle">99.9% STERILE</text>

      <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#FFF1F4" stroke="#FFD9E2" stroke-width="1" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#C8202F" text-anchor="middle">AUTO SHUTOFF</text>

      <rect x="65" y="-14" width="95" height="28" rx="14" fill="#F4F4F6" stroke="#E2E2E6" stroke-width="1" />
      <text x="112" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#4B4B52" text-anchor="middle">COMPACT</text>
    </g>
  </g>
</svg>
