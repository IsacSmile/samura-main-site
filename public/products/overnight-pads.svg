<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg_ngt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0F5" />
      <stop offset="1" stop-color="#FFE4ED" />
    </linearGradient>
    <linearGradient id="box_ngt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFE4EB" />
    </linearGradient>
    <filter id="sh_ngt" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A0D1B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg_ngt)" />
  <circle cx="500" cy="140" r="130" fill="#FFD9E2" opacity="0.45" />
  <circle cx="90" cy="480" r="110" fill="#FFF1F4" opacity="0.7" />

  <!-- Packaging Box -->
  <g transform="translate(140, 90)" filter="url(#sh_ngt)">
    <rect width="320" height="420" rx="28" fill="url(#box_ngt)" stroke="#E896AA" stroke-width="2" />
    
    <!-- Top Accent Band -->
    <path d="M0 28 C0 12 12 0 28 0 L292 0 C308 0 320 12 320 28 L320 80 L0 80 Z" fill="#C8202F" />
    <text x="160" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SAMAURA</text>

    <!-- Packaging Motif: Extended Overnight Pad Silhouette -->
    <g transform="translate(160, 210)">
      <ellipse cx="0" cy="0" rx="68" ry="96" fill="#FFFFFF" stroke="#FFD9E2" stroke-width="2" />
      <path d="M -68 -15 C -102 -10 -102 10 -68 15 Z" fill="#FFEBF0" stroke="#F5A3B7" stroke-width="1.2" />
      <path d="M 68 -15 C 102 -10 102 10 68 15 Z" fill="#FFEBF0" stroke="#F5A3B7" stroke-width="1.2" />
      <ellipse cx="0" cy="10" rx="42" ry="68" fill="#FFF8F9" stroke="#FFD9E2" stroke-width="1.2" stroke-dasharray="3 3" />
      <line x1="0" y1="-40" x2="0" y2="45" stroke="#F5A3B7" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Product Wordmark Bottom -->
    <text x="160" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2C1820" text-anchor="middle" letter-spacing="1">OVERNIGHT PADS</text>
    <circle cx="160" cy="370" r="4" fill="#C8202F" />
  </g>
</svg>
