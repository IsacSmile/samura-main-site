<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F1F8" />
      <stop offset="50%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#EEDDF0" />
    </linearGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBF7FB" />
    </linearGradient>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B1F2B" />
      <stop offset="100%" stop-color="#67324B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#835270" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)" />
  <circle cx="680" cy="140" r="180" fill="#E8D5EC" opacity="0.4" filter="blur(40px)" />
  <circle cx="120" cy="680" r="160" fill="#FFD9E2" opacity="0.3" filter="blur(40px)" />

  <!-- Packaging Card / Box -->
  <g transform="translate(180, 140)" filter="url(#shadow)">
    <rect width="440" height="520" rx="36" fill="url(#packGrad)" stroke="#E8D5EC" stroke-width="2" />
    
    <!-- Top Brand Ribbon -->
    <path d="M0 36 C0 16 16 0 36 0 L404 0 C424 0 440 16 440 36 L440 120 L0 120 Z" fill="url(#nightGrad)" />
    
    <!-- Brand Text -->
    <text x="220" y="65" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SAMAURA</text>
    <text x="220" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFD9E2" text-anchor="middle" letter-spacing="2">OVERNIGHT CARE</text>

    <!-- Product Illustration: Extra Long Overnight Pad with Moon -->
    <g transform="translate(220, 260)">
      <ellipse cx="0" cy="0" rx="80" ry="125" fill="#F9F2FA" stroke="#D8BEDE" stroke-width="2" stroke-dasharray="4 4" />
      <!-- Extra Wide Rear -->
      <path d="M -70 50 C -105 90 105 90 70 50 Z" fill="#EEDDF0" stroke="#D8BEDE" stroke-width="1.5" />
      <!-- Wings -->
      <path d="M -80 -20 C -115 -15 -115 15 -80 20 Z" fill="#EEDDF0" stroke="#D8BEDE" stroke-width="1.5" />
      <path d="M 80 -20 C 115 -15 115 15 80 20 Z" fill="#EEDDF0" stroke="#D8BEDE" stroke-width="1.5" />
      <!-- Moon Icon Badge -->
      <circle cx="50" cy="-60" r="16" fill="#F4E87C" opacity="0.9" />
      <circle cx="55" cy="-63" r="14" fill="#F9F2FA" />
    </g>

    <!-- Product Title -->
    <text x="220" y="415" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#3B1F2B" text-anchor="middle">Extra Long Overnight Pads</text>
    <text x="220" y="440" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#6B5B62" text-anchor="middle">XXL (340mm) • Extra Wide Back Wing</text>

    <!-- Badges Row -->
    <g transform="translate(220, 480)">
      <rect x="-160" y="-14" width="95" height="28" rx="14" fill="#E8F8F3" stroke="#A7E4D3" stroke-width="1" />
      <text x="-112" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#2D7A61" text-anchor="middle">ZERO LEAKS</text>

      <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#FFF1F4" stroke="#FFD9E2" stroke-width="1" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#C8202F" text-anchor="middle">HEAVY FLOW</text>

      <rect x="65" y="-14" width="95" height="28" rx="14" fill="#F4F4F6" stroke="#E2E2E6" stroke-width="1" />
      <text x="112" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#4B4B52" text-anchor="middle">10 PADS</text>
    </g>
  </g>
</svg>
