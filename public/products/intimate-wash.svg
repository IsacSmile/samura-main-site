<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2FAF8" />
      <stop offset="50%" stop-color="#FCFFFE" />
      <stop offset="100%" stop-color="#E2F5F0" />
    </linearGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7FCFA" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D7A61" />
      <stop offset="100%" stop-color="#4AB392" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#2D7A61" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />
  <circle cx="680" cy="140" r="180" fill="#CCEFE5" opacity="0.4" filter="blur(40px)" />
  <circle cx="120" cy="680" r="160" fill="#FFD9E2" opacity="0.3" filter="blur(40px)" />

  <g transform="translate(180, 140)" filter="url(#shadow)">
    <rect width="440" height="520" rx="36" fill="url(#packGrad)" stroke="#BDE8DC" stroke-width="2" />
    
    <path d="M0 36 C0 16 16 0 36 0 L404 0 C424 0 440 16 440 36 L440 120 L0 120 Z" fill="url(#tealGrad)" />
    
    <text x="220" y="65" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SAMAURA</text>
    <text x="220" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2F5EF" text-anchor="middle" letter-spacing="2">BOTANICAL DERMA-CARE</text>

    <!-- Bottle Illustration -->
    <g transform="translate(220, 260)">
      <!-- Pump Top -->
      <path d="M -15 -110 L 25 -110 C 35 -110 35 -95 25 -95 L 0 -95 L 0 -80 L -15 -80 Z" fill="#2D7A61" />
      <rect x="-8" y="-80" width="16" height="15" fill="#E2E2E6" />
      <!-- Bottle Body -->
      <path d="M -45 -65 C -45 -65 45 -65 45 -65 C 55 -65 55 -40 55 0 L 50 80 C 50 90 40 95 30 95 L -30 95 C -40 95 -50 90 -50 80 L -55 0 C -55 -40 -45 -65 -45 -65 Z" fill="#EEFAF6" stroke="#9FDBCB" stroke-width="2" />
      <!-- Label On Bottle -->
      <rect x="-35" y="-20" width="70" height="75" rx="8" fill="#FFFFFF" stroke="#CCEFE5" stroke-width="1.5" />
      <circle cx="0" cy="0" r="14" fill="#E2F5EF" />
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#2D7A61" text-anchor="middle">3.5</text>
      <text x="0" y="30" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#6B5B62" text-anchor="middle">TEA TREE</text>
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#9CA3AF" text-anchor="middle">ALOE VERA</text>
    </g>

    <text x="220" y="415" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#3B1F2B" text-anchor="middle">pH 3.5 Foaming Intimate Wash</text>
    <text x="220" y="440" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#6B5B62" text-anchor="middle">Tea Tree &amp; Calendula • Soap &amp; Paraben-Free</text>

    <g transform="translate(220, 480)">
      <rect x="-160" y="-14" width="95" height="28" rx="14" fill="#E8F8F3" stroke="#A7E4D3" stroke-width="1" />
      <text x="-112" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#2D7A61" text-anchor="middle">pH 3.5 BALANCED</text>

      <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#FFF1F4" stroke="#FFD9E2" stroke-width="1" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#C8202F" text-anchor="middle">DERMA TESTED</text>

      <rect x="65" y="-14" width="95" height="28" rx="14" fill="#F4F4F6" stroke="#E2E2E6" stroke-width="1" />
      <text x="112" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#4B4B52" text-anchor="middle">150 ML</text>
    </g>
  </g>
</svg>
