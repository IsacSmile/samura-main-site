<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="50%" stop-color="#FFFDF9" />
      <stop offset="1" stop-color="#FBF4E8" />
    </linearGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FDFCF9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="1" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#D97706" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />
  <circle cx="680" cy="140" r="180" fill="#FDE68A" opacity="0.3" filter="blur(40px)" />
  <circle cx="120" cy="680" r="160" fill="#FFD9E2" opacity="0.3" filter="blur(40px)" />

  <g transform="translate(180, 140)" filter="url(#shadow)">
    <rect width="440" height="520" rx="36" fill="url(#packGrad)" stroke="#FDE68A" stroke-width="2" />
    
    <path d="M0 36 C0 16 16 0 36 0 L404 0 C424 0 440 16 440 36 L440 120 L0 120 Z" fill="url(#amberGrad)" />
    
    <text x="220" y="65" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SAMAURA</text>
    <text x="220" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FEF3C7" text-anchor="middle" letter-spacing="2">PERIOD WELLNESS</text>

    <!-- Roll-on Bottle Illustration -->
    <g transform="translate(220, 260)">
      <!-- Cap -->
      <rect x="-24" y="-105" width="48" height="50" rx="8" fill="#D97706" />
      <line x1="-20" y1="-85" x2="20" y2="-85" stroke="#FDE68A" stroke-width="1.5" stroke-linecap="round" />
      <!-- Glass Roller Bottle -->
      <rect x="-28" y="-55" width="56" height="150" rx="16" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2" />
      <!-- Amber Liquid Content -->
      <rect x="-24" y="-30" width="48" height="120" rx="12" fill="#FEF3C7" opacity="0.8" />
      <!-- Label -->
      <rect x="-24" y="-20" width="48" height="85" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1" />
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#B45309" text-anchor="middle">HERBAL</text>
      <text x="0" y="18" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#3B1F2B" text-anchor="middle">RELIEF</text>
      <circle cx="0" cy="35" r="7" fill="#FEF3C7" />
      <path d="M 0 31 C -2 33 -2 37 0 39 C 2 37 2 33 0 31 Z" fill="#D97706" />
    </g>

    <text x="220" y="415" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#3B1F2B" text-anchor="middle">Cramp Relief Botanical Roll-On</text>
    <text x="220" y="440" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#6B5B62" text-anchor="middle">Eucalyptus, Wintergreen &amp; Lavender Oils</text>

    <g transform="translate(220, 480)">
      <rect x="-160" y="-14" width="95" height="28" rx="14" fill="#E8F8F3" stroke="#A7E4D3" stroke-width="1" />
      <text x="-112" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#2D7A61" text-anchor="middle">FAST ACTING</text>

      <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#FFF1F4" stroke="#FFD9E2" stroke-width="1" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#C8202F" text-anchor="middle">NO STAINS</text>

      <rect x="65" y="-14" width="95" height="28" rx="14" fill="#F4F4F6" stroke="#E2E2E6" stroke-width="1" />
      <text x="112" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#4B4B52" text-anchor="middle">50 ML</text>
    </g>
  </g>
</svg>
