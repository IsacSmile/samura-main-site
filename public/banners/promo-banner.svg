<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="promoBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FDE2EC" />
      <stop offset="1" stop-color="#F8C8D8" />
    </linearGradient>
    <linearGradient id="rosePill" x1="0%" y1="0%" x2="1" y2="0%">
      <stop offset="0%" stop-color="#C8202F" />
      <stop offset="1" stop-color="#A01525" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="700" fill="url(#promoBg)" />

  <!-- Soft Layered Shapes -->
  <circle cx="1400" cy="200" r="260" fill="#FFCCD8" opacity="0.3" />
  <circle cx="200" cy="500" r="320" fill="#FFEBF0" opacity="0.5" />
  <circle cx="1250" cy="520" r="180" fill="#FFCCD8" opacity="0.4" />

  <!-- Typographic Layout -->
  <g transform="translate(140, 200)">
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#FFFFFF" stroke="#FFCCD8" stroke-width="1.5" />
    <circle cx="18" cy="18" r="5" fill="#C8202F" />
    <text x="32" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#C8202F" letter-spacing="1">GENTLE SOFTNESS</text>

    <text x="0" y="105" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#3B1F2B">
      Thoughtful Intimate Care.
    </text>
    <text x="0" y="165" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#C8202F">
      Designed For Daily Peace.
    </text>

    <text x="0" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6B5B62">
      Everyday comfort with soft cotton textures, discreet doorstep delivery, and transparent ingredients.
    </text>

    <!-- Value propositions -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="200" height="42" rx="21" fill="#FFFFFF" stroke="#FFE4EC" />
      <text x="100" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3B1F2B" text-anchor="middle">Unscented &amp; Soft</text>

      <rect x="220" y="0" width="200" height="42" rx="21" fill="#FFFFFF" stroke="#FFE4EC" />
      <text x="320" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3B1F2B" text-anchor="middle">Zero Synthetic Dyes</text>

      <rect x="440" y="0" width="200" height="42" rx="21" fill="#FFFFFF" stroke="#FFE4EC" />
      <text x="540" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3B1F2B" text-anchor="middle">Plain Brown Box</text>
    </g>
  </g>
</svg>
